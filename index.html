<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091A3A">
<title>UNHCR</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="manifest" href="manifest.json">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#091A3A;color:#F0F6FF;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem 1.5rem;background:radial-gradient(ellipse at 50% -10%,#0F2456 0%,#091A3A 68%)}
.wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px;animation:fadeUp .45s cubic-bezier(.22,1,.36,1)}
.logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:1.4rem}
.pulse{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.08),transparent 70%);animation:pulse 3.5s ease-in-out infinite}
.logo{width:92px;height:92px;display:block;filter:drop-shadow(0 0 28px rgba(14,165,233,.36))}
.name{font-size:2.2rem;font-weight:900;letter-spacing:.06em;background:linear-gradient(160deg,#F0F6FF 30%,#7DD3FC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1.8rem}
.features{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:1.6rem;width:100%}
.feat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:.52rem .6rem;font-size:.56rem;font-weight:600;color:rgba(240,246,255,.55);display:flex;align-items:center;gap:.36rem}
.btn-pi{width:100%;padding:1.05rem;background:linear-gradient(135deg,#1a56db,#0ea5e9);border:none;border-radius:14px;color:#fff;font-size:1rem;font-weight:800;min-height:56px;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 32px rgba(14,165,233,.3)}
.btn-pi:active{opacity:.82}.btn-pi:disabled{opacity:.38;cursor:not-allowed}
.btn-guest{width:100%;padding:.8rem;background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.09);border-radius:14px;color:rgba(240,246,255,.6);font-size:.9rem;font-weight:600;min-height:50px;cursor:pointer;touch-action:manipulation;margin-top:.6rem}
.btn-guest:active{background:rgba(255,255,255,.1)}.btn-guest:disabled{opacity:.38}
.status{font-size:.56rem;color:rgba(240,246,255,.38);margin-top:.9rem;min-height:20px;text-align:center;line-height:1.6}
.status.err{color:#fca5a5}.status.ok{color:#10b981}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.35rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-wrap">
    <div class="pulse"></div>
    <img class="logo" src="assets/icons/logo.svg" alt="UNHCR" loading="eager">
  </div>
  <div class="name">UNHCR</div>
  <div class="features">
    <div class="feat">🚨 Emergency</div>
    <div class="feat">🏠 Shelter</div>
    <div class="feat">🏥 Healthcare</div>
    <div class="feat">⚖️ Legal Aid</div>
    <div class="feat">📚 Education</div>
    <div class="feat">🤖 AI Assistant</div>
  </div>
  <button class="btn-pi" id="signBtn" onclick="doSignIn()">Sign In with Pi</button>
  <button class="btn-guest" id="guestBtn" onclick="doGuest()">Continue as Guest</button>
  <div class="status" id="status"></div>
</div>
<script>
/* ═══════════════════════════════════════════════════════
   UNHCR — index.html — MAINNET (sandbox:false)
   Served at /
   After login → app.html (never back to /app)
═══════════════════════════════════════════════════════ */

var _ready = false;

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

function setLoading(on) {
  var sb = document.getElementById('signBtn');
  var gb = document.getElementById('guestBtn');
  sb.disabled = on;
  gb.disabled = on;
  sb.innerHTML = on
    ? '<span class="spinner"></span>Signing in...'
    : 'Sign In with Pi';
}

/* ── Init SDK immediately — no auto-redirect ── */
/* User must always explicitly sign in or use guest mode */
/* This prevents the session-restore redirect loop */
initSDK();

/* ── SDK Init ── */
function initSDK() {
  if (typeof Pi === 'undefined') {
    window.addEventListener('load', function () {
      if (typeof Pi === 'undefined') {
        setStatus('Open this app inside Pi Browser.', 'err');
        return;
      }
      tryInit();
    });
    return;
  }
  tryInit();
}

function tryInit() {
  try {
    Pi.init({ version: '2.0', sandbox: false });
    _ready = true;
  } catch (e) {
    setStatus('SDK error: ' + e.message, 'err');
  }
}

/* ── Sign In ── */
function doSignIn() {
  if (!_ready) {
    try {
      Pi.init({ version: '2.0', sandbox: false });
      _ready = true;
    } catch (e) {
      setStatus('Open this app inside Pi Browser.', 'err');
      return;
    }
  }
  setLoading(true);
  setStatus('');

  Pi.authenticate(
    ['username'],
    /* onIncompletePaymentFound — plain function, no async */
    function onIncompletePaymentFound(payment) {
      fetch('/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentId: payment.identifier })
      }).catch(function () {});
    }
  )
  .then(function (auth) {
    if (!auth || !auth.user) {
      setLoading(false);
      setStatus('Sign in was cancelled.', 'err');
      return;
    }
    try {
      localStorage.setItem('unhcr_user', JSON.stringify(auth.user));
    } catch (e) {}
    setStatus('Welcome, @' + auth.user.username + '!', 'ok');
    setTimeout(function () {
      window.location.replace('app.html');
    }, 500);
  })
  .catch(function (err) {
    setLoading(false);
    setStatus(
      'Sign in failed: ' + (err && err.message ? err.message : 'Please try again.'),
      'err'
    );
  });
}

/* ── Guest Mode ── */
function doGuest() {
  try {
    localStorage.setItem(
      'unhcr_user',
      JSON.stringify({ username: 'guest', isGuest: true })
    );
  } catch (e) {}
  window.location.replace('app.html');
}
</script>
</body>
</html>
