<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091A3A">
<meta name="description" content="UNHCR — Humanitarian Support">
<meta name="application-name" content="UNHCR">
<meta property="og:title" content="UNHCR">
<meta property="og:description" content="Humanitarian information and community support.">
<meta property="og:image" content="assets/icons/logo.svg">
<meta property="og:type" content="website">
<title>UNHCR</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="apple-touch-icon" href="assets/icons/logo.svg">
<link rel="manifest" href="manifest.json">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:#091A3A;color:#F0F6FF;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem 1.5rem;background:radial-gradient(ellipse at 50% -10%,#0F2456 0%,#091A3A 68%)}
.splash{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px;animation:fadeUp .5s cubic-bezier(.22,1,.36,1)}
.logo-wrap{position:relative;margin-bottom:1.4rem;display:flex;align-items:center;justify-content:center}
.logo-img{width:92px;height:92px;display:block;filter:drop-shadow(0 0 28px rgba(14,165,233,.36))}
.logo-pulse{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.08) 0%,transparent 70%);animation:pulse 3.5s ease-in-out infinite}
.app-name{font-size:2.2rem;font-weight:900;letter-spacing:.06em;background:linear-gradient(160deg,#F0F6FF 30%,#7DD3FC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1.8rem}
.features{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:1.6rem;width:100%}
.feat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:.52rem .6rem;font-size:.56rem;font-weight:600;color:rgba(240,246,255,.55);display:flex;align-items:center;gap:.36rem;letter-spacing:-.01em}
.feat-i{font-size:1rem;flex-shrink:0}
.sign-btn{width:100%;padding:1.05rem;background:linear-gradient(135deg,#1a56db,#0ea5e9);border:none;border-radius:14px;color:#fff;font-size:1rem;font-weight:800;min-height:56px;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 32px rgba(14,165,233,.3);letter-spacing:.01em;transition:opacity .15s,transform .12s}
.sign-btn:active{opacity:.82;transform:scale(.98)}
.sign-btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.guest-btn{width:100%;padding:.8rem;background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.09);border-radius:14px;color:rgba(240,246,255,.6);font-size:.9rem;font-weight:600;min-height:50px;cursor:pointer;touch-action:manipulation;margin-top:.6rem;transition:background .15s}
.guest-btn:active{background:rgba(255,255,255,.1)}
.guest-btn:disabled{opacity:.38;cursor:not-allowed}
.status{font-size:.56rem;color:rgba(240,246,255,.38);margin-top:.9rem;min-height:20px;text-align:center;transition:color .2s;line-height:1.6}
.status.err{color:#fca5a5}.status.ok{color:#10b981}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.38rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
</style>
</head>
<body>
<div class="splash">
  <div class="logo-wrap">
    <div class="logo-pulse"></div>
    <img class="logo-img" src="assets/icons/logo.svg" alt="UNHCR" loading="eager">
  </div>
  <div class="app-name">UNHCR</div>
  <div class="features">
    <div class="feat"><span class="feat-i">🚨</span>Emergency Resources</div>
    <div class="feat"><span class="feat-i">🏠</span>Shelter Directory</div>
    <div class="feat"><span class="feat-i">🏥</span>Healthcare</div>
    <div class="feat"><span class="feat-i">⚖️</span>Legal Aid</div>
    <div class="feat"><span class="feat-i">📚</span>Education</div>
    <div class="feat"><span class="feat-i">🤖</span>AI Assistant</div>
  </div>
  <button class="sign-btn" id="signBtn" onclick="doSignIn()">Sign In with Pi</button>
  <button class="guest-btn" id="guestBtn" onclick="doGuest()">Continue as Guest</button>
  <div class="status" id="status"></div>
</div>
<script>
/* MAINNET — sandbox:false */
var _ready = false;

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

function setLoading(on) {
  var sb = document.getElementById('signBtn');
  var gb = document.getElementById('guestBtn');
  sb.disabled = on;
  gb.disabled = on;
  sb.innerHTML = on ? '<span class="spinner"></span>Signing in...' : 'Sign In with Pi';
}

/* Init SDK immediately — not inside load event */
(function initSDK() {
  if (typeof Pi === 'undefined') {
    window.addEventListener('load', function() {
      if (typeof Pi === 'undefined') {
        setStatus('Open this app inside Pi Browser.', 'err');
        return;
      }
      tryInit();
    });
    return;
  }
  tryInit();
})();

function tryInit() {
  try {
    Pi.init({ version: '2.0', sandbox: false });
    _ready = true;
  } catch (e) {
    setStatus('SDK error: ' + e.message, 'err');
  }
}

function doSignIn() {
  if (!_ready) {
    try {
      Pi.init({ version: '2.0', sandbox: false });
      _ready = true;
    } catch (e) {
      setStatus('Open this app inside Pi Browser.', 'err');
      return;
    }
  }
  setLoading(true);
  setStatus('');
  Pi.authenticate(
    ['username'],
    function onIncompletePaymentFound(payment) {
      fetch('/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentId: payment.identifier })
      }).catch(function() {});
    }
  )
  .then(function(auth) {
    if (!auth || !auth.user) {
      setLoading(false);
      setStatus('Sign in was cancelled.', 'err');
      return;
    }
    try {
      localStorage.setItem('unhcr_user', JSON.stringify(auth.user));
    } catch (e) {}
    setStatus('Welcome, @' + auth.user.username + '!', 'ok');
    setTimeout(function() {
      window.location.href = 'app.html';
    }, 500);
  })
  .catch(function(err) {
    setLoading(false);
    var msg = err && err.message ? err.message : 'Please try again.';
    setStatus('Sign in failed: ' + msg, 'err');
  });
}

function doGuest() {
  try {
    localStorage.setItem('unhcr_user', JSON.stringify({ username: 'guest', isGuest: true }));
  } catch (e) {}
  window.location.href = 'app.html';
}
/* service worker disabled */
</script>
</body>
</html>
