<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg"><link rel="apple-touch-icon" href="assets/icons/logo.svg"><link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<title>UNHCR.pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#0A1628;color:#F0F6FF;font-size:16px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none}
input,textarea,select{font-family:inherit;color:#F0F6FF;background:none;border:none;outline:none}
a{color:#0ea5e9;text-decoration:none}

/* \u2550\u2550\u2550 LAYOUT \u2550\u2550\u2550 */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#hdr{background:rgba(10,22,40,.97);border-bottom:1px solid rgba(255,255,255,.07);padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between;height:54px;flex-shrink:0}
.brand{font-size:1.1rem;font-weight:900;letter-spacing:-.03em}.brand b{color:#0ea5e9}
.hdr-r{display:flex;gap:.35rem;align-items:center}
.hdr-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;min-height:38px;position:relative}
.hdr-btn:active{background:rgba(255,255,255,.1)}
#hdr-av{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1a56db,#0ea5e9);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;cursor:pointer;box-shadow:0 2px 12px rgba(26,86,219,.35)}
.notif-dot{position:absolute;top:4px;right:4px;width:9px;height:9px;background:#ef4444;border-radius:50%;border:2px solid #0A1628}
#main{flex:1;overflow:hidden;position:relative;min-height:0}
.scr{display:none;flex-direction:column;height:100%;overflow:hidden}
.scr.on{display:flex;animation:fu .16s ease}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:88px;overscroll-behavior-y:contain}
.scroll::-webkit-scrollbar{display:none}

/* \u2550\u2550\u2550 NAV \u2550\u2550\u2550 */
#nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:rgba(10,22,40,.98);border-top:1px solid rgba(255,255,255,.08);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;cursor:pointer;border:none;background:none;color:rgba(240,246,255,.28);font-size:.5rem;font-weight:700;min-height:76px;touch-action:manipulation;padding:.4rem .1rem;position:relative;transition:color .15s}
.nb.on{color:#0ea5e9}
.nb:active{opacity:.6}
.nb-i{font-size:1.6rem;line-height:1}
.nb-pip{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:#0ea5e9;opacity:0;transition:opacity .2s}
.nb.on .nb-pip{opacity:1}

/* \u2550\u2550\u2550 OVERLAY \u2550\u2550\u2550 */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(5px)}
#ov.open{display:flex;animation:fadeIn .18s ease}
.panel{width:100%;background:#0d1e38;border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.09);max-height:92vh;display:flex;flex-direction:column;animation:slideUp .24s cubic-bezier(.22,1,.36,1)}
.phandle{width:34px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.12);margin:.6rem auto .3rem;flex-shrink:0}
.phead{display:flex;align-items:center;justify-content:space-between;padding:.4rem 1rem .55rem;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.ptitle{font-size:.88rem;font-weight:800;color:#F0F6FF}
.pclose{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.78rem;color:rgba(240,246,255,.4);border:none;min-height:32px}
.pclose:active{background:rgba(255,255,255,.12)}
.pbody{overflow-y:auto;padding:.65rem 1rem 2.5rem;flex:1}
.pbody::-webkit-scrollbar{display:none}

/* \u2550\u2550\u2550 TOAST \u2550\u2550\u2550 */
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(8px);background:#1a2d4a;border:1px solid rgba(255,255,255,.1);color:#F0F6FF;font-size:.58rem;font-weight:600;padding:.4rem 1.1rem;border-radius:99px;opacity:0;transition:all .22s;pointer-events:none;z-index:999;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.s{background:rgba(16,185,129,.2);color:#10b981;border-color:rgba(16,185,129,.3)}
#toast.e{background:rgba(239,68,68,.18);color:#ef4444;border-color:rgba(239,68,68,.28)}
#toast.w{background:rgba(245,158,11,.15);color:#f59e0b;border-color:rgba(245,158,11,.28)}

/* \u2550\u2550\u2550 CARDS \u2550\u2550\u2550 */
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:.9rem 1rem;margin-bottom:.75rem}
.card-blue{background:linear-gradient(135deg,rgba(26,86,219,.16),rgba(14,165,233,.08));border-color:rgba(14,165,233,.25)}
.card-red{background:rgba(239,68,68,.09);border-color:rgba(239,68,68,.2)}
.card-green{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2)}
.card-orange{background:rgba(245,158,11,.09);border-color:rgba(245,158,11,.2)}
.card-purple{background:rgba(124,58,237,.1);border-color:rgba(124,58,237,.22)}
.card-teal{background:rgba(13,148,136,.1);border-color:rgba(13,148,136,.25)}

/* \u2550\u2550\u2550 SECTION LABELS \u2550\u2550\u2550 */
.sec{padding:.75rem 1rem .28rem;font-size:.48rem;font-weight:700;color:rgba(240,246,255,.32);letter-spacing:.13em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.sact{font-size:.52rem;font-weight:700;color:#0ea5e9;cursor:pointer;letter-spacing:0;text-transform:none}

/* \u2550\u2550\u2550 GRID \u2550\u2550\u2550 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.05rem 1rem .35rem}
.gc{border-radius:16px;padding:.9rem .8rem;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;touch-action:manipulation;border:1.5px solid transparent;position:relative;overflow:hidden}
.gc:active{opacity:.72;transform:scale(.97)}
.gc-ico{font-size:1.6rem;margin-bottom:.3rem}
.gc-t{font-size:.64rem;font-weight:800;color:#F0F6FF;line-height:1.25;margin-bottom:.06rem}
.gc-s{font-size:.42rem;color:rgba(240,246,255,.52);line-height:1.4}
.gc-shine{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 55%);pointer-events:none}

/* \u2550\u2550\u2550 RESOURCE ROWS \u2550\u2550\u2550 */
.res{display:flex;align-items:center;gap:.65rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.75rem .85rem;margin-bottom:.32rem;cursor:pointer;min-height:60px;touch-action:manipulation}
.res:active{background:rgba(255,255,255,.08)}
.res-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.res-body{flex:1;min-width:0}
.res-t{font-size:.64rem;font-weight:700;color:#F0F6FF}
.res-s{font-size:.44rem;color:rgba(240,246,255,.42);margin-top:.04rem}
.res-a{font-size:.85rem;color:rgba(240,246,255,.22);flex-shrink:0}

/* \u2550\u2550\u2550 PILLS \u2550\u2550\u2550 */
.pill{display:inline-flex;align-items:center;font-size:.38rem;font-weight:700;border-radius:99px;padding:.06rem .28rem}
.pb{background:rgba(14,165,233,.16);color:#0ea5e9;border:1px solid rgba(14,165,233,.28)}
.pr{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.22)}
.pg{background:rgba(16,185,129,.14);color:#10b981;border:1px solid rgba(16,185,129,.22)}
.po{background:rgba(245,158,11,.14);color:#f59e0b;border:1px solid rgba(245,158,11,.22)}
.pp{background:rgba(124,58,237,.14);color:#8b5cf6;border:1px solid rgba(124,58,237,.22)}

/* \u2550\u2550\u2550 FORMS \u2550\u2550\u2550 */
.inp{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.65rem .85rem;font-size:.75rem;color:#F0F6FF;margin-bottom:.45rem;min-height:50px;display:block;transition:border-color .15s}
.inp:focus{border-color:#0ea5e9;background:rgba(14,165,233,.05)}
.inp::placeholder{color:rgba(240,246,255,.22)}
select.inp option{background:#0d1e38;color:#F0F6FF}
.fl{font-size:.48rem;font-weight:700;color:rgba(240,246,255,.38);display:block;margin-bottom:.18rem;text-transform:uppercase;letter-spacing:.06em}
.btn-p{width:100%;padding:.85rem;background:linear-gradient(135deg,#1a56db,#0ea5e9);border:none;border-radius:12px;color:#fff;font-size:.85rem;font-weight:700;min-height:52px;margin-top:.3rem;box-shadow:0 4px 20px rgba(26,86,219,.32);cursor:pointer;touch-action:manipulation}
.btn-p:active{opacity:.8}
.btn-o{width:100%;padding:.75rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:rgba(240,246,255,.7);font-size:.8rem;min-height:48px;margin-top:.3rem;cursor:pointer;touch-action:manipulation}
.btn-o:active{opacity:.75}
.btn-red{width:100%;padding:.8rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:12px;color:#ef4444;font-size:.82rem;font-weight:600;min-height:48px;cursor:pointer;touch-action:manipulation}

/* \u2550\u2550\u2550 STATS STRIP \u2550\u2550\u2550 */
.stats-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;padding:0 1rem;margin:.35rem 0}
.stat-tile{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.55rem .4rem;text-align:center;cursor:pointer;touch-action:manipulation;min-height:58px}
.stat-tile:active{background:rgba(255,255,255,.09)}
.stat-v{font-size:.95rem;font-weight:800;color:#0ea5e9;line-height:1}
.stat-l{font-size:.38rem;color:rgba(240,246,255,.35);margin-top:.06rem;text-transform:uppercase;letter-spacing:.06em;line-height:1.3}

/* \u2550\u2550\u2550 PROFILE ROWS \u2550\u2550\u2550 */
.pr-row{display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.72rem .85rem;cursor:pointer;min-height:56px;margin-bottom:.3rem;touch-action:manipulation;border:none;width:100%;text-align:left;color:#F0F6FF;background:rgba(255,255,255,.04)}
.pr-row:active{background:rgba(255,255,255,.08)}
.pr-ico{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.pr-t{font-size:.64rem;font-weight:700;color:#F0F6FF}
.pr-s{font-size:.44rem;color:rgba(240,246,255,.38);margin-top:.04rem}
.pr-a{margin-left:auto;font-size:.88rem;color:rgba(240,246,255,.22);flex-shrink:0}

/* \u2550\u2550\u2550 ADVANCED COMPONENTS \u2550\u2550\u2550 */
/* Alert banners */
.alert-card{border-radius:14px;padding:.85rem 1rem;margin-bottom:.45rem;position:relative;overflow:hidden;cursor:pointer}
.alert-card:active{opacity:.8}
.alert-title{font-size:.65rem;font-weight:800;margin-bottom:.12rem}
.alert-body{font-size:.5rem;color:rgba(240,246,255,.58);line-height:1.72}
.alert-tag{font-size:.36rem;font-weight:700;border-radius:99px;padding:.05rem .28rem;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;margin-top:.3rem}

/* Mood */
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin:.4rem 0}
.mood-btn{border-radius:12px;padding:.6rem .25rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:pointer;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);min-height:62px;touch-action:manipulation;transition:all .15s}
.mood-btn:active{transform:scale(.9)}
.mood-btn.sel{border-color:rgba(14,165,233,.5);background:rgba(14,165,233,.12)}
.mood-ico{font-size:1.5rem;line-height:1}
.mood-lbl{font-size:.38rem;font-weight:600;color:rgba(240,246,255,.45)}
.mood-bar-wrap{display:flex;align-items:flex-end;gap:3px;height:52px;margin:.4rem 0}
.mood-bar{flex:1;border-radius:3px 3px 0 0;min-height:4px;transition:height .4s ease}

/* Doc checklist */
.doc-item{display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.65rem .85rem;margin-bottom:.28rem;cursor:pointer;min-height:52px;touch-action:manipulation;transition:all .15s}
.doc-item.done{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.22)}
.doc-chk{width:26px;height:26px;border-radius:7px;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem;transition:all .15s}
.doc-item.done .doc-chk{background:#10b981;border-color:#10b981}
.doc-label{font-size:.6rem;font-weight:600;color:#F0F6FF;flex:1}
.doc-sub{font-size:.42rem;color:rgba(240,246,255,.38);margin-top:.03rem}

/* Progress ring */
.pring{position:relative;width:76px;height:76px;flex-shrink:0}
.pring svg{transform:rotate(-90deg)}
.pring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#0ea5e9}

/* Phrase cards */
.phrase-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.75rem .9rem;margin-bottom:.32rem;cursor:pointer;touch-action:manipulation}
.phrase-card:active{background:rgba(255,255,255,.08)}
.phr-en{font-size:.65rem;font-weight:700;color:#F0F6FF;margin-bottom:.16rem}
.phr-tr{font-size:.6rem;color:#0ea5e9;font-weight:600;margin-bottom:.06rem}
.phr-ph{font-size:.48rem;color:rgba(240,246,255,.38);font-style:italic}

/* Symptom */
.sym-opt{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.09);border-radius:10px;padding:.58rem .8rem;font-size:.6rem;font-weight:600;color:#F0F6FF;cursor:pointer;min-height:46px;margin-bottom:.28rem;width:100%;text-align:left;touch-action:manipulation;transition:all .15s}
.sym-opt:active{background:rgba(255,255,255,.1)}
.sym-opt.sel{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#fca5a5}

/* Services */
.svc-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.78rem .9rem;margin-bottom:.35rem}
.svc-name{font-size:.65rem;font-weight:700;color:#F0F6FF}
.svc-type{font-size:.44rem;color:#0ea5e9;margin:.04rem 0}
.svc-addr{font-size:.44rem;color:rgba(240,246,255,.42)}
.svc-phone{font-size:.44rem;color:rgba(240,246,255,.42);margin-top:.03rem}

/* Notice */
.notice-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.78rem .9rem;margin-bottom:.35rem}
.notice-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.18rem}
.notice-title{font-size:.62rem;font-weight:700;color:#F0F6FF;flex:1;margin-right:.4rem}
.notice-date{font-size:.4rem;color:rgba(240,246,255,.32);flex-shrink:0}
.notice-body{font-size:.5rem;color:rgba(240,246,255,.52);line-height:1.75;margin-bottom:.28rem}
.notice-foot{display:flex;justify-content:space-between;align-items:center}
.notice-author{font-size:.42rem;color:rgba(240,246,255,.3)}

/* Timeline */
.tl-item{display:flex;gap:.65rem;margin-bottom:.55rem}
.tl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:.18rem}
.tl-body{flex:1;padding-bottom:.45rem;border-bottom:1px solid rgba(255,255,255,.05)}
.tl-year{font-size:.7rem;font-weight:800;margin-bottom:.06rem}
.tl-title{font-size:.6rem;font-weight:700;color:#F0F6FF}
.tl-text{font-size:.48rem;color:rgba(240,246,255,.45);line-height:1.65;margin-top:.04rem}

/* Search */
.srch-inp{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:99px;padding:.5rem 1rem;font-size:.64rem;color:#F0F6FF;min-height:44px;transition:border-color .15s}
.srch-inp:focus{border-color:#0ea5e9;outline:none}
.srch-inp::placeholder{color:rgba(240,246,255,.22)}

/* News / updates */
.update-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:.85rem;margin-bottom:.4rem;display:flex;align-items:flex-start;gap:.65rem}
.update-ico{font-size:1.4rem;flex-shrink:0;margin-top:.05rem}
.update-body{flex:1}
.update-t{font-size:.62rem;font-weight:700;color:#F0F6FF;margin-bottom:.12rem}
.update-s{font-size:.48rem;color:rgba(240,246,255,.5);line-height:1.72;margin-bottom:.25rem}

/* Lang pills */
.lang-row{display:flex;gap:.28rem;flex-wrap:wrap;margin:.3rem 0}
.lpill{background:rgba(14,165,233,.09);border:1px solid rgba(14,165,233,.22);border-radius:99px;padding:.2rem .52rem;font-size:.44rem;font-weight:700;color:#0ea5e9;cursor:pointer;touch-action:manipulation}
.lpill.on{background:rgba(14,165,233,.22);border-color:rgba(14,165,233,.45)}

/* Empty */
.empty{text-align:center;padding:3rem 1.5rem}
.empty-i{font-size:3rem;display:block;margin-bottom:.6rem}
.empty-t{font-size:.85rem;font-weight:800;margin-bottom:.28rem}
.empty-s{font-size:.58rem;color:rgba(240,246,255,.35);line-height:1.8}

/* Searchbar wrapper */
.srch-wrap{padding:.35rem 1rem .2rem}

/* AI bubble */
.ai-msg{background:rgba(14,165,233,.09);border:1px solid rgba(14,165,233,.2);border-radius:12px;padding:.7rem .85rem;margin-bottom:.4rem;font-size:.55rem;color:rgba(240,246,255,.75);line-height:1.85}
.ai-msg b{color:#0ea5e9}

/* map placeholder */
.map-ph{background:rgba(14,165,233,.07);border:1px solid rgba(14,165,233,.18);border-radius:14px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;margin-bottom:.5rem;cursor:pointer}
.map-ph-i{font-size:2.2rem}
.map-ph-t{font-size:.6rem;font-weight:700;color:#0ea5e9}
.map-ph-s{font-size:.46rem;color:rgba(240,246,255,.35)}

/* Scam / security check item */
.sec-item{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.55rem;color:rgba(240,246,255,.65);line-height:1.75}
.sec-item:last-child{border-bottom:none}
.sec-ico{font-size:1rem;flex-shrink:0;margin-top:.05rem}

/* Survival/guide list */
.guide-item{display:flex;align-items:flex-start;gap:.55rem;padding:.45rem 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.54rem;color:rgba(240,246,255,.65);line-height:1.72}
.guide-item:last-child{border-bottom:none}
.guide-num{width:22px;height:22px;border-radius:50%;background:rgba(14,165,233,.2);border:1px solid rgba(14,165,233,.35);display:flex;align-items:center;justify-content:center;font-size:.44rem;font-weight:800;color:#0ea5e9;flex-shrink:0;margin-top:.05rem}

/* FAQ */
.faq-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.7rem .85rem;margin-bottom:.3rem;cursor:pointer}
.faq-q{font-size:.6rem;font-weight:700;color:#F0F6FF;display:flex;justify-content:space-between;align-items:center}
.faq-a{font-size:.52rem;color:rgba(240,246,255,.55);line-height:1.75;margin-top:.3rem;display:none}
.faq-item.open .faq-a{display:block}

/* Sbar */
.sbar{padding:.6rem 1rem .25rem;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.sbar-t{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.sbar-s{font-size:.44rem;color:rgba(240,246,255,.38);margin-top:.06rem}

/* SOS */
.sos-banner{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(239,68,68,.08));border:2px solid rgba(239,68,68,.45);border-radius:16px;padding:1rem;margin:0 1rem .5rem;text-align:center}
.sos-title{font-size:.78rem;font-weight:800;color:#fca5a5;margin:.35rem 0 .2rem}
.sos-sub{font-size:.5rem;color:rgba(240,246,255,.55);line-height:1.75;margin-bottom:.6rem}
.sos-btn{background:rgba(239,68,68,.25);border:1.5px solid rgba(239,68,68,.5);border-radius:10px;padding:.6rem 1.2rem;color:#fca5a5;font-size:.7rem;font-weight:700;cursor:pointer;min-height:44px;touch-action:manipulation}
.sos-btn:active{opacity:.8}

/* Coming soon badge */
.cs-badge{display:inline-flex;align-items:center;font-size:.36rem;font-weight:700;border-radius:99px;padding:.04rem .26rem;background:rgba(245,158,11,.14);color:#f59e0b;border:1px solid rgba(245,158,11,.28);margin-left:.3rem}

/* Animations */
@keyframes fu{from{opacity:.01;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="brand" style="display:flex;align-items:center;gap:.35rem"><img src="assets/icons/logo.svg" alt="" style="width:24px;height:24px;filter:drop-shadow(0 0 5px rgba(14,165,233,.45))">UNHCR<b>.pi</b></div>
    <div class="hdr-r">
      <div class="hdr-btn" onclick="openSearch()">&#x1F50D;</div>
      <div class="hdr-btn" id="alert-btn" onclick="openCrisisAlerts()">
        &#x1F6A8;<div class="notif-dot"></div>
      </div>
      <div class="hdr-btn" onclick="openLang()">&#x1F310;</div>
      <div id="hdr-av" onclick="goTab('profile',document.querySelectorAll('.nb')[4])">G</div>
    </div>
  </div>

  <div id="main">
    <div class="scr on" id="scr-home"><div class="scroll" id="home-scroll"></div></div>
    <div class="scr" id="scr-resources">
      <div class="sbar"><div><div class="sbar-t">&#x1F4DA; Resources</div><div class="sbar-s">Humanitarian resource directory</div></div></div>
      <div class="srch-wrap"><input class="srch-inp" placeholder="&#x1F50D; Search all resources..." oninput="searchRes(this.value)"></div>
      <div class="scroll" id="res-scroll"></div>
    </div>
    <div class="scr" id="scr-emergency">
      <div class="sbar"><div><div class="sbar-t" style="color:#ef4444">&#x1F6A8; Emergency</div><div class="sbar-s">Crisis resources &amp; emergency guides</div></div></div>
      <div class="scroll" id="emer-scroll"></div>
    </div>
    <div class="scr" id="scr-volunteer">
      <div class="sbar"><div><div class="sbar-t">&#x1F91D; Volunteer</div><div class="sbar-s">Community engagement &amp; opportunities</div></div></div>
      <div class="scroll" id="vol-scroll"></div>
    </div>
    <div class="scr" id="scr-profile">
      <div class="sbar"><div><div class="sbar-t">&#x1F464; Profile</div><div class="sbar-s">Settings &amp; personal tools</div></div></div>
      <div class="scroll" id="prof-scroll"></div>
    </div>
  </div>

  <div id="nav">
    <button class="nb on" onclick="goTab('home',this)"><div class="nb-pip"></div><div class="nb-i">&#x1F3E0;</div>Home</button>
    <button class="nb" onclick="goTab('resources',this)"><div class="nb-pip"></div><div class="nb-i">&#x1F4DA;</div>Resources</button>
    <button class="nb" onclick="goTab('emergency',this)"><div class="nb-pip"></div><div class="nb-i">&#x1F6A8;</div>Emergency</button>
    <button class="nb" onclick="goTab('volunteer',this)"><div class="nb-pip"></div><div class="nb-i">&#x1F91D;</div>Volunteer</button>
    <button class="nb" onclick="goTab('profile',this)"><div class="nb-pip"></div><div class="nb-i">&#x1F464;</div>Profile</button>
  </div>

  <div id="ov" onclick="if(event.target===this)closeP()">
    <div class="panel">
      <div class="phandle"></div>
      <div class="phead"><div class="ptitle" id="ptitle">Panel</div><button class="pclose" onclick="closeP()">&#x2715;</button></div>
      <div class="pbody" id="pbody"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   STATE
\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
var piUser=null, _lang='English', _mood=[], _docs={}, _notices=[], _saved=[], _notes=[], _downloads=[], _emergContacts=[];
var _alertsList=[
  {lv:'red',ico:'\ud83d\udea8',title:'Active Conflict Alert',body:'Heightened displacement risk in multiple regions. Emergency shelters activated. Follow official guidance.',tag:'URGENT'},
  {lv:'orange',ico:'\u26a0\ufe0f',title:'Seasonal Flood Warning',body:'Flooding affecting riverside and coastal communities. Prepare evacuation plans now.',tag:'WARNING'},
  {lv:'blue',ico:'\u2139\ufe0f',title:'Vaccination Campaign Active',body:'Free vaccinations underway in multiple regions. Visit your nearest health center.',tag:'HEALTH'},
];
var _piLang='English';

/* LOAD */
try{var u=localStorage.getItem('unhcr_user');if(u)piUser=JSON.parse(u);}catch(e){}
try{var m=localStorage.getItem('unhcr_mood');if(m)_mood=JSON.parse(m);}catch(e){}
try{var d=localStorage.getItem('unhcr_docs');if(d)_docs=JSON.parse(d);}catch(e){}
try{var n=localStorage.getItem('unhcr_notices');if(n)_notices=JSON.parse(n);}catch(e){}
try{var s=localStorage.getItem('unhcr_saved');if(s)_saved=JSON.parse(s);}catch(e){}
try{var nt=localStorage.getItem('unhcr_notes');if(nt)_notes=JSON.parse(nt);}catch(e){}
try{var lg=localStorage.getItem('unhcr_lang');if(lg)_lang=lg;}catch(e){}
try{var ec=localStorage.getItem('unhcr_emerg_contacts');if(ec)_emergContacts=JSON.parse(ec);}catch(e){}

/* auth guard moved to load event below */

/* SAVE */
function saveMood(){try{localStorage.setItem('unhcr_mood',JSON.stringify(_mood));}catch(e){}}
function saveDocs(){try{localStorage.setItem('unhcr_docs',JSON.stringify(_docs));}catch(e){}}
function saveNotices(){try{localStorage.setItem('unhcr_notices',JSON.stringify(_notices));}catch(e){}}
function saveSaved(){try{localStorage.setItem('unhcr_saved',JSON.stringify(_saved));}catch(e){}}
function saveNotes(){try{localStorage.setItem('unhcr_notes',JSON.stringify(_notes));}catch(e){}}
function saveEmergContacts(){try{localStorage.setItem('unhcr_emerg_contacts',JSON.stringify(_emergContacts));}catch(e){}}

/* MAINNET BOOT — Pi.init() sandbox:false */
(function() {
  if (typeof Pi !== 'undefined') {
    try { Pi.init({ version: '2.0', sandbox: false }); } catch(e) {}
  }
})();

window.addEventListener('load', function() {
  if (!piUser) {
    /* Inline login — zero redirects — breaks all loops */
    document.body.style.cssText='display:flex;align-items:center;justify-content:center;height:100vh;background:#091A3A;font-family:system-ui,sans-serif;padding:2rem';
    document.body.innerHTML='<div style="text-align:center;width:100%;max-width:320px">'
      +'<img src="assets/icons/logo.svg" style="width:80px;height:80px;display:block;margin:0 auto 1rem;filter:drop-shadow(0 0 16px rgba(14,165,233,.4))">'
      +'<div style="font-size:1.8rem;font-weight:900;color:#F0F6FF;letter-spacing:.06em;margin-bottom:1.6rem">UNHCR</div>'
      +'<button id="_piBtn" onclick="_inlineSignIn()" style="width:100%;padding:1rem;background:linear-gradient(135deg,#1a56db,#0ea5e9);border:none;border-radius:14px;color:#fff;font-size:1rem;font-weight:800;min-height:56px;cursor:pointer;margin-bottom:.6rem;touch-action:manipulation">Sign In with Pi</button>'
      +'<button onclick="_inlineGuest()" style="width:100%;padding:.8rem;background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.09);border-radius:14px;color:rgba(240,246,255,.6);font-size:.9rem;font-weight:600;min-height:50px;cursor:pointer;touch-action:manipulation">Continue as Guest</button>'
      +'<div id="_st" style="font-size:.55rem;color:rgba(240,246,255,.38);margin-top:.8rem;min-height:18px"></div>'
      +'</div>';
    if(typeof Pi!=='undefined'){try{Pi.init({version:'2.0',sandbox:false});}catch(e){}}
    return;
  }

  /* Update avatar */
  var av = document.getElementById('hdr-av');
  if (av && piUser.username) av.textContent = piUser.username[0].toUpperCase();

  /* Silent re-auth to refresh session — plain function() callbacks */
  if (typeof Pi !== 'undefined' && !piUser.isGuest) {
    Pi.authenticate(
      ['username'],
      function onIncompletePaymentFound(payment) {
        fetch('/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId: payment.identifier })
        }).catch(function() {});
      }
    ).then(function(a) {
      if (a && a.user) {
        piUser = a.user;
        try { localStorage.setItem('unhcr_user', JSON.stringify(piUser)); } catch(e) {}
        var av2 = document.getElementById('hdr-av');
        if (av2 && piUser.username) av2.textContent = piUser.username[0].toUpperCase();
      }
    }).catch(function() {
      /* Silent fail — user already loaded from localStorage */
    });
  }

  goTab('home', document.querySelector('.nb'));
});

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   NAVIGATION
\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
function goTab(name,el){
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  var scr=document.getElementById('scr-'+name);if(scr)scr.classList.add('on');
  if(el)el.classList.add('on');
  if(name==='home')renderHome();
  else if(name==='resources')renderResources();
  else if(name==='emergency')renderEmergency();
  else if(name==='volunteer')renderVolunteer();
  else if(name==='profile')renderProfile();
}
function openP(title,html){document.getElementById('ptitle').textContent=title;document.getElementById('pbody').innerHTML=html;document.getElementById('ov').className='open';}
function closeP(){document.getElementById('ov').className='';}
function toast(msg,type,dur){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='show'+(type?' '+type:'');
  clearTimeout(toast._t);toast._t=setTimeout(function(){el.className='';},dur||2600);
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   HELPER BUILDERS
\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
function gc(ico,title,sub,bg,bc,fn){
  return '<div class="gc" style="background:'+bg+';border-color:'+bc+'" onclick="'+fn+'">'
    +'<div class="gc-ico">'+ico+'</div>'
    +'<div><div class="gc-t">'+title+'</div><div class="gc-s">'+sub+'</div></div>'
    +'<div class="gc-shine"></div></div>';
}
function res(ico,ibg,title,sub,fn){
  return '<div class="res" onclick="'+fn+'">'
    +'<div class="res-ico" style="background:'+ibg+'">'+ico+'</div>'
    +'<div class="res-body"><div class="res-t">'+title+'</div><div class="res-s">'+sub+'</div></div>'
    +'<div class="res-a">&#x203A;</div></div>';
}
function prow(ico,ibg,title,sub,fn){
  return '<button class="pr-row" onclick="'+fn+'">'
    +'<div class="pr-ico" style="background:'+ibg+'">'+ico+'</div>'
    +'<div style="flex:1;min-width:0"><div class="pr-t">'+title+'</div><div class="pr-s">'+sub+'</div></div>'
    +'<div class="pr-a">&#x203A;</div></button>';
}
function updateCard(ico,ibg,title,sub,tagHtml){
  return '<div class="update-card"><div class="update-ico" style="background:'+ibg+';width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">'+ico+'</div>'
    +'<div class="update-body"><div class="update-t">'+title+'</div><div class="update-s">'+sub+'</div>'+tagHtml+'</div></div>';
}
function secLabel(text,action,actionFn){
  return '<div class="sec">'+text+(action?'<span class="sact" onclick="'+actionFn+'">'+action+'</span>':'')+'</div>';
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   HOME
\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
function renderHome(){
  var name=piUser&&piUser.username?piUser.username:'Friend';
  var h=new Date().getHours();
  var greet=h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening';
  var today=new Date().toDateString();
  var tm=_mood.find(function(m){return m.date===today;});
  var mE=tm?['\ud83d\ude04','\ud83d\ude42','\ud83d\ude10','\ud83d\ude1f','\ud83d\ude22'][tm.score]:'\ud83d\udc99';
  var dc=Object.values(_docs).filter(Boolean).length;
  var dp=Math.round(dc/12*100);

  document.getElementById('home-scroll').innerHTML=
    /* Greeting */
    '<div style="padding:.7rem 1rem .25rem;display:flex;align-items:center;justify-content:space-between">'
      +'<div><div style="font-size:.47rem;color:rgba(240,246,255,.38)">'+greet+', <b style="color:#F0F6FF">@'+name+'</b></div>'
        +'<div style="font-size:.88rem;font-weight:900;letter-spacing:-.03em">UNHCR<b style="color:#0ea5e9">.pi</b></div></div>'
      +'<div onclick="openCrisisAlerts()" style="width:34px;height:34px;border-radius:9px;background:rgba(239,68,68,.14);border:1.5px solid rgba(239,68,68,.32);display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;position:relative">&#x1F6A8;<div style="position:absolute;top:-3px;right:-3px;width:9px;height:9px;background:#ef4444;border-radius:50%;border:2px solid #0A1628"></div></div>'
    +'</div>'

    /* Stats strip */
    +'<div class="stats-strip">'
      +'<div class="stat-tile" onclick="openWellbeing()"><div class="stat-v" style="font-size:1.4rem">'+mE+'</div><div class="stat-l">Today\'s<br>Mood</div></div>'
      +'<div class="stat-tile" onclick="openDocChecklist()"><div class="stat-v">'+dp+'%</div><div class="stat-l">Docs<br>Secured</div></div>'
      +'<div class="stat-tile" onclick="openCrisisAlerts()"><div class="stat-v" style="color:#ef4444">'+_alertsList.length+'</div><div class="stat-l">Active<br>Alerts</div></div>'
    +'</div>'

    /* Hero */
    +'<div style="margin:.4rem 1rem;background:linear-gradient(135deg,rgba(26,86,219,.18),rgba(14,165,233,.08));border:1px solid rgba(14,165,233,.22);border-radius:18px;padding:1.1rem 1rem;position:relative;overflow:hidden">'
      +'<div style="font-size:.92rem;font-weight:800;line-height:1.35;margin-bottom:.32rem">Humanitarian Resources &amp; Community Support</div>'
      +'<div style="font-size:.5rem;color:rgba(240,246,255,.5);line-height:1.75;margin-bottom:.55rem">Emergency resources, shelter, healthcare, legal aid, education, and volunteer opportunities \u2014 all in one place.</div>'
      +'<div style="display:flex;gap:.32rem;flex-wrap:wrap">'
        +'<span class="pill pr">&#x1F6A8; Emergency</span>'
        +'<span class="pill pg">&#x1FA7A; Health</span>'
        +'<span class="pill po">&#x1F4DA; Education</span>'
        +'<span class="pill pb">&#x1F91D; Volunteer</span>'
      +'</div>'
      +'<div style="position:absolute;bottom:-20px;right:-8px;font-size:7rem;opacity:.028;pointer-events:none">&#x1F30D;</div>'
    +'</div>'

    /* Quick Access */
    +secLabel('Quick Access')
    +'<div class="grid2">'
      +gc('&#x1F6A8;','Emergency','Crisis resources','rgba(239,68,68,.12)','rgba(239,68,68,.3)',"goTab('emergency',document.querySelectorAll('.nb')[2])")
      +gc('&#x1FA7A;','Healthcare','Clinics &amp; hospitals','rgba(16,185,129,.1)','rgba(16,185,129,.28)',"openHealthcare()")
      +gc('&#x1F3E0;','Shelter','Shelter directory','rgba(245,158,11,.1)','rgba(245,158,11,.28)',"openShelter()")
      +gc('&#x1F4DA;','Education','Learning resources','rgba(124,58,237,.1)','rgba(124,58,237,.28)',"openEducation()")
      +gc('&#x1F91D;','Volunteer','Get involved','rgba(14,165,233,.1)','rgba(14,165,233,.28)',"goTab('volunteer',document.querySelectorAll('.nb')[3])")
      +gc('&#x1F916;','AI Assistant','Get humanitarian help','rgba(26,86,219,.12)','rgba(26,86,219,.3)',"openAI()")
    +'</div>'

    /* Advanced Tools */
    +secLabel('Advanced Tools')
    +'<div class="grid2">'
      +gc('&#x1F4AC;','Phrase Cards','Emergency multilingual','rgba(14,165,233,.1)','rgba(14,165,233,.28)',"openPhraseCards()")
      +gc('&#x2705;','Doc Checklist',dp+'% secured','rgba(16,185,129,.1)','rgba(16,185,129,.28)',"openDocChecklist()")
      +gc('&#x1F9EA;','Symptom Check','Health triage tool','rgba(239,68,68,.1)','rgba(239,68,68,.28)',"openSymptomChecker()")
      +gc('&#x1F4CD;','Find Services','Nearby orgs &amp; offices','rgba(245,158,11,.1)','rgba(245,158,11,.28)',"openServicesFinder()")
      +gc('&#x1F4CB;','Notice Board','Community notices','rgba(124,58,237,.1)','rgba(124,58,237,.28)',"openNoticeBoard()")
      +gc('&#x1F60A;','Wellbeing',mE+' Today','rgba(236,72,153,.1)','rgba(236,72,153,.28)',"openWellbeing()")
    +'</div>'

    /* More Tools */
    +secLabel('More Tools')
    +'<div class="grid2">'
      +gc('&#x1F4C5;','Community Events','Events &amp; meetups','rgba(245,158,11,.1)','rgba(245,158,11,.28)',"openCommunityEvents()")
      +gc('&#x1F4A1;','Preparedness','Disaster readiness','rgba(239,68,68,.1)','rgba(239,68,68,.28)',"openDisasterCenter()")
      +gc('&#x1F5FA;','Resource Map','Find services map','rgba(14,165,233,.1)','rgba(14,165,233,.28)',"openResourceMap()")
      +gc('&#x1F4DD;','My Notes','Personal notes','rgba(124,58,237,.1)','rgba(124,58,237,.28)',"openNotes()")
      +gc('&#x1F4DE;','Emergency Contacts','My personal SOS list','rgba(239,68,68,.12)','rgba(239,68,68,.3)',"openPersonalEmergContacts()")
      +gc('&#x1F4E5;','Downloads','Offline guides','rgba(16,185,129,.1)','rgba(16,185,129,.28)',"openDownloads()")
    +'</div>'

    /* Crisis alerts preview */
    +secLabel('Crisis Alerts','View all','openCrisisAlerts()')
    +'<div style="padding:0 1rem">'
      +_alertsList.slice(0,2).map(function(a){
        var bg=a.lv==='red'?'rgba(239,68,68,.12)':a.lv==='orange'?'rgba(245,158,11,.1)':'rgba(14,165,233,.1)';

/* \u2500\u2500 27. WELLBEING CHECK-IN \u2500\u2500 */
function openWellbeing(){
  var moods=[{e:'\ud83d\ude04',l:'Great'},{e:'\ud83d\ude42',l:'Good'},{e:'\ud83d\ude10',l:'Okay'},{e:'\ud83d\ude1f',l:'Low'},{e:'\ud83d\ude22',l:'Struggling'}];
  var today=new Date().toDateString();
  var tm=_mood.find(function(m){return m.date===today;});
  var html='<div style="font-size:.65rem;font-weight:700;margin-bottom:.35rem">How are you feeling today?</div>'
    +'<div style="font-size:.5rem;color:rgba(240,246,255,.42);margin-bottom:.6rem;line-height:1.75">Your wellbeing matters. Responses are stored only on your device.</div>'
    +'<div class="mood-grid">';
  moods.forEach(function(m,i){
    var sel=tm&&tm.score===i?' sel':'';
    html+='<div class="mood-btn'+sel+'" onclick="logMood('+i+',\''+m.l+'\')">'
      +'<div class="mood-ico">'+m.e+'</div><div class="mood-lbl">'+m.l+'</div></div>';
  });
  html+='</div>';
  if(_mood.length>0){
    html+='<div style="font-size:.5rem;font-weight:700;color:rgba(240,246,255,.42);text-transform:uppercase;letter-spacing:.08em;margin:.65rem 0 .28rem">7-Day Wellbeing Chart</div>';
    html+='<div class="mood-bar-wrap">';
    _mood.slice(-7).forEach(function(m){
      var h=Math.max(5,Math.round((4-m.score)/4*48)+4);
      var col=m.score<=1?'#10b981':m.score===2?'#f59e0b':'#ef4444';
      html+='<div class="mood-bar" style="height:'+h+'px;background:'+col+'"></div>';
    });
    html+='</div>';
    var avg=_mood.slice(-7).reduce(function(s,m){return s+m.score;},0)/Math.min(_mood.length,7);
    html+='<div style="font-size:.48rem;color:rgba(240,246,255,.38)">7-day average: <b style="color:#0ea5e9">'+(['Great \ud83d\ude04','Good \ud83d\ude42','Okay \ud83d\ude10','Low \ud83d\ude1f','Struggling \ud83d\ude22'][Math.round(avg)])+'</b></div>';
  }
  if(tm&&tm.score>=3){
    html+='<div class="card card-blue" style="margin-top:.55rem"><div style="font-size:.6rem;font-weight:700;margin-bottom:.28rem">&#x1F499; Support Available</div>'
      +'<div style="font-size:.5rem;color:rgba(240,246,255,.58);line-height:1.75">Crisis Text Line: HOME to 741741<br>Samaritans: 116 123 (UK)<br>Befrienders: befrienders.org</div>'
      +'<button onclick="openMentalHealth()" style="background:rgba(14,165,233,.18);border:1px solid rgba(14,165,233,.3);border-radius:8px;padding:.32rem .65rem;color:#0ea5e9;font-size:.55rem;font-weight:700;cursor:pointer;margin-top:.38rem;min-height:34px">More Support &#x203A;</button>'
    +'</div>';
  }
  openP('&#x1F60A; Daily Wellbeing',html);
}
function logMood(score,label){
  var today=new Date().toDateString();
  _mood=_mood.filter(function(m){return m.date!==today;});
  _mood.push({date:today,score:score,label:label});
  if(_mood.length>30)_mood=_mood.slice(-30);
  saveMood();
  toast('Mood logged: '+label,'s');
  openWellbeing();
}

  {id:'goback',ico:'&#x1F392;',label:'Go-Bag Ready',sub:'72-hour emergency kit packed'},
];
function openDocChecklist(){
  var done=Object.keys(_docs).filter(function(k){return DOC_LIST.find(function(d){return d.id===k;})&&_docs[k];}).length;
  var pct=Math.round(done/DOC_LIST.length*100);
  var html='<div style="display:flex;align-items:center;gap:.85rem;margin-bottom:.65rem">'
    +'<div class="pring"><svg width="76" height="76"><circle cx="38" cy="38" r="31" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6.5"/>'
      +'<circle cx="38" cy="38" r="31" fill="none" stroke="#0ea5e9" stroke-width="6.5" stroke-dasharray="'+(194.8*pct/100)+' 194.8" stroke-linecap="round"/></svg>'
      +'<div class="pring-val">'+pct+'%</div></div>'
    +'<div><div style="font-size:.7rem;font-weight:800">'+done+' of '+DOC_LIST.length+'</div>'
      +'<div style="font-size:.48rem;color:rgba(240,246,255,.38);margin-top:.04rem">Documents secured</div>'
      +(pct===100?'<div style="font-size:.48rem;color:#10b981;margin-top:.08rem">&#x2705; All secured!</div>':'<div style="font-size:.48rem;color:#f59e0b;margin-top:.08rem">&#x26A0; '+(DOC_LIST.length-done)+' remaining</div>')
    +'</div></div>';
  DOC_LIST.forEach(function(d){
    var dn=_docs[d.id];
    html+='<div class="doc-item'+(dn?' done':'')+'" onclick="toggleDoc(\''+d.id+'\')">'
      +'<div class="doc-chk">'+(dn?'&#x2713;':'')+'</div>'
      +'<div style="font-size:1.05rem;flex-shrink:0">'+d.ico+'</div>'
      +'<div style="flex:1;min-width:0"><div class="doc-label">'+d.label+'</div><div class="doc-sub">'+d.sub+'</div></div>'
    +'</div>';
  });
  html+='<button class="btn-p" style="margin-top:.5rem" onclick="exportDocChecklist()">&#x1F4E4; Export Checklist</button>';
  openP('&#x2705; Document Checklist',html);
}
function toggleDoc(id){_docs[id]=!_docs[id];saveDocs();openDocChecklist();toast(_docs[id]?'Secured \u2705':'Unmarked','s');}
function exportDocChecklist(){
  var txt='UNHCR.pi Document Safety Checklist\
'+('=').repeat(36)+'\
';
  DOC_LIST.forEach(function(d){txt+=(_docs[d.id]?'[\u2713] ':'[ ] ')+d.label+'\
';});
  txt+='\
Generated by UNHCR Community Platform';
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download='document-checklist.txt';a.click();
  toast('Checklist exported','s');
}

function openPhraseCards(){
  var langs=Object.keys(PHRASES);
  var phrases=PHRASES[_phraseL]||PHRASES.English;
  var html='<div style="font-size:.5rem;color:rgba(240,246,255,.38);margin-bottom:.45rem">Tap any phrase to copy it. Switch language below.</div>'
    +'<div class="lang-row">';
  langs.forEach(function(l){html+='<span class="lpill'+(l===_phraseL?' on':'')+'" onclick="switchPL(\''+l.replace(/'/g,"\\'")+'\')">'+(l.split(' - ')[0])+'</span>';});
  html+='</div><div style="margin-top:.5rem">';
  phrases.forEach(function(p){
    html+='<div class="phrase-card" onclick="copyTxt(\''+p.e+'\')">'
      +'<div class="phr-en">&#x1F310; '+p.e+'</div>'
      +(p.t&&p.t!==p.e?'<div class="phr-tr">'+p.t+'</div>':'')
      +(p.p?'<div class="phr-ph">'+p.p+'</div>':'')
    +'</div>';
  });
  html+='</div>';
  openP('&#x1F4AC; Phrase Cards \u2014 '+_phraseL.split(' - ')[0],html);
}
function switchPL(l){_phraseL=l;openPhraseCards();}
function copyTxt(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Copied: '+t,'s');}).catch(function(){toast(t);});else toast(t);}

  rme:{result:true,lv:'blue',title:'\ud83d\udc99 Mental Health Support',body:'Your feelings are valid. Reaching out is strength. Consider calling a support line or speaking to someone you trust.',fn:'openMentalHealth()'},

};
function openSymptomChecker(){showSym('start');}
function showSym(id){
  var n=SYM[id];if(!n)return;
  if(n.result){
    var bg=n.lv==='red'?'rgba(239,68,68,.14)':n.lv==='orange'?'rgba(245,158,11,.12)':n.lv==='blue'?'rgba(14,165,233,.12)':'rgba(16,185,129,.1)';
    var bc=n.lv==='red'?'rgba(239,68,68,.32)':n.lv==='orange'?'rgba(245,158,11,.3)':n.lv==='blue'?'rgba(14,165,233,.3)':'rgba(16,185,129,.28)';
    var tc=n.lv==='red'?'#fca5a5':n.lv==='orange'?'#fde68a':n.lv==='blue'?'#93c5fd':'#6ee7b7';
    var html='<div style="background:'+bg+';border:1.5px solid '+bc+';border-radius:14px;padding:1rem;margin-bottom:.55rem">'
      +'<div style="font-size:.72rem;font-weight:800;color:'+tc+';margin-bottom:.28rem">'+n.title+'</div>'
      +'<div style="font-size:.52rem;color:rgba(240,246,255,.68);line-height:1.8">'+n.body+'</div>'
    +'</div>'
    +'<button class="btn-p" onclick="'+n.fn+'" style="margin-bottom:.3rem">Get Help &#x203A;</button>'
    +'<button class="btn-o" onclick="showSym(\'start\')">&#x1F504; Start Over</button>'
    +'<div style="font-size:.42rem;color:rgba(240,246,255,.25);margin-top:.45rem;line-height:1.75">&#x26A0; General guidance only. Not a medical diagnosis. Always consult a qualified healthcare professional.</div>';
    document.getElementById('ptitle').textContent='&#x1F9EA; Symptom Checker';
    document.getElementById('pbody').innerHTML=html;
    if(document.getElementById('ov').className!=='open')document.getElementById('ov').className='open';
    return;
  }
  var html='<div style="font-size:.65rem;font-weight:700;margin-bottom:.45rem">'+n.q+'</div>';
  n.opts.forEach(function(o){html+='<button class="sym-opt" onclick="showSym(\''+o.n+'\')">'+o.l+'</button>';});
  html+='<div style="font-size:.42rem;color:rgba(240,246,255,.25);margin-top:.45rem;line-height:1.75">&#x26A0; General guidance only. Not a medical diagnosis.</div>';
  document.getElementById('ptitle').textContent='&#x1F9EA; Symptom Checker';
  document.getElementById('pbody').innerHTML=html;
  if(document.getElementById('ov').className!=='open')document.getElementById('ov').className='open';
}

function postNotice(){
  var t=((document.getElementById('n-t')||{}).value||'').trim();
  var b=((document.getElementById('n-b')||{}).value||'').trim();
  var tag=((document.getElementById('n-tag')||{}).value)||'General';
  if(!t||!b){toast('Fill in all fields','e');return;}
  var name=piUser&&piUser.username?'@'+piUser.username:'Community Member';
  _notices.push({id:Date.now(),author:name,title:t,body:b,date:new Date().toISOString().slice(0,10),tag:tag});
  saveNotices();toast('Notice posted!','s');openNoticeBoard();
}

function _inlineSignIn() {
  var btn = document.getElementById('_piBtn');
  var st = document.getElementById('_st');
  if(btn) btn.disabled = true;
  if(st) st.textContent = 'Signing in...';
  if(typeof Pi==='undefined'){if(st)st.textContent='Open in Pi Browser.';if(btn)btn.disabled=false;return;}
  Pi.authenticate(['username'], function(p){
    fetch('/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier})}).catch(function(){});
  }).then(function(auth){
    if(!auth||!auth.user){if(btn)btn.disabled=false;if(st)st.textContent='Cancelled.';return;}
    try{localStorage.setItem('unhcr_user',JSON.stringify(auth.user));}catch(e){}
    if(st)st.textContent='Welcome, @'+auth.user.username+'!';
    setTimeout(function(){window.location.reload();},500);
  }).catch(function(e){
    if(btn)btn.disabled=false;
    if(st)st.textContent='Failed: '+(e&&e.message?e.message:'Try again.');
  });
}
function _inlineGuest() {
  try{localStorage.setItem('unhcr_user',JSON.stringify({username:'guest',isGuest:true}));}catch(e){}
  window.location.reload();
}
