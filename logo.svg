<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2456"/>
      <stop offset="100%" stop-color="#091A3A"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <!-- Subtle ring -->
  <circle cx="100" cy="100" r="88" stroke="rgba(14,165,233,0.12)" stroke-width="1.5" fill="none"/>

  <!-- Shield body -->
  <path d="M100 30 L148 50 L148 100 C148 128 126 148 100 158 C74 148 52 128 52 100 L52 50 Z"
        fill="url(#shieldGrad)" opacity="0.95"/>

  <!-- Shield inner highlight -->
  <path d="M100 38 L140 55 L140 100 C140 124 122 141 100 150 C78 141 60 124 60 100 L60 55 Z"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>

  <!-- Rising arc (hope / dawn) -->
  <path d="M72 108 A32 32 0 0 1 128 108"
        stroke="url(#arcGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Small arc rays suggesting a sunrise -->
  <line x1="100" y1="71" x2="100" y2="64" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="114" y1="74" x2="118" y2="68" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="86" y1="74" x2="82" y2="68" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="124" y1="82" x2="129" y2="77" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="76" y1="82" x2="71" y2="77" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Open upturned hand (protection / giving) -->
  <!-- Palm base -->
  <path d="M84 120 Q84 115 88 113 L88 103 Q88 100 91 100 Q94 100 94 103 L94 110
           L94 101 Q94 98 97 98 Q100 98 100 101 L100 110
           L100 102 Q100 99 103 99 Q106 99 106 102 L106 110
           L106 104 Q106 101.5 108.5 101.5 Q111 101.5 111 104 L111 114
           Q114 115 116 120 Q116 128 100 130 Q84 128 84 120 Z"
        fill="url(#handGrad)" opacity="0.95"/>

  <!-- Subtle hand shading -->
  <path d="M94 110 L94 103" stroke="rgba(14,165,233,0.25)" stroke-width="0.8"/>
  <path d="M100 110 L100 101" stroke="rgba(14,165,233,0.25)" stroke-width="0.8"/>
  <path d="M106 110 L106 102" stroke="rgba(14,165,233,0.25)" stroke-width="0.8"/>

  <!-- Three small people/figures above hand suggesting community -->
  <circle cx="92" cy="96" r="3.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="100" cy="94" r="3.5" fill="#7DD3FC" opacity="0.9"/>
  <circle cx="108" cy="96" r="3.5" fill="#38BDF8" opacity="0.8"/>
</svg>
